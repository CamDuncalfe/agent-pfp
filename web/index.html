<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent PFP builder</title>
    <link rel="stylesheet" href="builder.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Agent PFP builder</h1>
        <label class="style-picker">
          Style
          <select id="style" disabled></select>
        </label>
        <p id="notice" class="muted" role="status"></p>
      </header>

      <p id="status" role="status"></p>

      <div class="layout">
        <section aria-label="Preview">
          <canvas id="preview" width="64" height="64" role="img" aria-label="Profile picture preview"></canvas>
          <div class="actions">
            <button type="button" id="randomize" disabled>Randomize</button>
            <button type="button" id="download" class="primary" disabled>Download PNG</button>
          </div>
        </section>

        <div>
          <form id="controls" aria-label="Layers"></form>
          <section aria-labelledby="selection-heading">
            <h2 id="selection-heading">Layers, bottom first</h2>
            <ol id="selection"></ol>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="builder.js"></script>
  </body>
</html>
